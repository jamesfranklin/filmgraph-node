name = "filmgraph-node"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# --- Node identity: edit these for your deployment ---------------------------
[vars]
NODE_ID = "example"
NODE_NAME = "Example FilmGraph node"
OPERATOR_NAME = "Example Operator"
OPERATOR_URL = "https://example.org"
# 1 = public layer, 2 = private layer (showtimes, campaigns, reserved edges)
NODE_LAYER = "1"
# none | optional | required
NODE_AUTH = "required"
# Public URL of this node; used for the manifest's mcp.url. Leave empty to derive from the request.
PUBLIC_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "filmgraph"
# Replace after `wrangler d1 create filmgraph`
database_id = "00000000-0000-0000-0000-000000000000"

# --- Doc Society -------------------------------------------------------------
# Deploy: npm run deploy -- --env docsociety   (after `wrangler d1 create filmgraph-docsociety`)
[env.docsociety]
name = "filmgraph-docsociety"
routes = [{ pattern = "filmgraph.docsociety.org", custom_domain = true }]

[env.docsociety.vars]
NODE_ID = "docsociety"
NODE_NAME = "Doc Society FilmGraph node"
OPERATOR_NAME = "Doc Society"
OPERATOR_URL = "https://docsociety.org"
NODE_LAYER = "1"
NODE_AUTH = "required"
PUBLIC_URL = "https://filmgraph.docsociety.org"

[[env.docsociety.d1_databases]]
binding = "DB"
database_name = "filmgraph-docsociety"
database_id = "00000000-0000-0000-0000-000000000000"
