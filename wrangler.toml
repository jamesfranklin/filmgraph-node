name = "filmgraph-node"
main = "src/entry-worker.ts"
compatibility_date = "2026-10-01"

# --- Node identity: edit these for your deployment ---------------------------
[vars]
NODE_ID = "example"
NODE_NAME = "Example FilmGraph node"
OPERATOR_NAME = "Example Operator"
OPERATOR_URL = "https://example.org"
# 1 = public layer, 2 = private layer (showtimes, campaigns, reserved edges)
NODE_LAYER = "1"
# none | optional | required
NODE_AUTH = "required"
# Public URL of this node; used for the manifest's mcp.url. Leave empty to derive from the request.
PUBLIC_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "filmgraph"
# Replace after `wrangler d1 create filmgraph`
database_id = "00000000-0000-0000-0000-000000000000"

# --- A second deployment ------------------------------------------------------
# One worker per operator: copy this block, name it, point it at its own D1.
# Deploy: npm run deploy -- --env mynode   (after `wrangler d1 create filmgraph-mynode`)
# [env.mynode]
# name = "filmgraph-mynode"
# routes = [{ pattern = "filmgraph.example.org", custom_domain = true }]
#
# [env.mynode.vars]
# NODE_ID = "mynode"
# NODE_NAME = "Example Archive FilmGraph node"
# OPERATOR_NAME = "Example Archive"
# OPERATOR_URL = "https://example.org"
# NODE_LAYER = "1"
# NODE_AUTH = "required"
# PUBLIC_URL = "https://filmgraph.example.org"
#
# [[env.mynode.d1_databases]]
# binding = "DB"
# database_name = "filmgraph-mynode"
# database_id = "00000000-0000-0000-0000-000000000000"
